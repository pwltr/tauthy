name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run type check
        run: yarn run tsc:check

      - name: Run lint check
        run: yarn run lint:check

      - name: Run format check
        run: yarn run format:check

      - name: Run frontend tests
        run: yarn run test

      - name: Build frontend
        run: yarn run build

  vault-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@86e7197484018ef6aaa9255d186f6ce1754276dd # 1.97.0

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: './src-tauri -> target'

      - name: Check default file vault production build
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Check legacy backend compatibility
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --no-default-features --tests

      # Run the full suite once, including sync, using temporary NTFS directories
      # and fake credentials. Native credentials remain explicitly opt-in.
      - name: Test default backend and crash recovery on Windows
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --nocapture

      # Explicit opt-in on a disposable hosted runner only. The test creates a
      # random development-namespace credential and cleans up its own entry.
      - name: Verify native Windows credential round trip
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml native_backend_round_trip_and_reopen -- --ignored --nocapture

  rust:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@86e7197484018ef6aaa9255d186f6ce1754276dd # 1.97.0

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: './src-tauri -> target'

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Check legacy backend compatibility
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --no-default-features --tests

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # Node 24
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
