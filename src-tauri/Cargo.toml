[package]
name = "tauthy"
version = "0.6.0"
description = "A cross-platform TOTP authentication client built with tauri"
authors = ["philippwalter@pm.me"]
license = "GPL-3.0 License"
repository = "https://github.com/pwltr/tauthy"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
data-encoding = "2.11.1"
dryoc = { version = "1.0.0", default-features = false, features = ["u64_backend"] }
ring = "0.17.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.1", features = ["tray-icon"] }
iota-crypto = { version = "0.23.2", features = ["blake2b", "pbkdf2", "sha"] }
iota_stronghold = "2.1.0"
zeroize = { version = "1.4", features = ["zeroize_derive"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2.4.0"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2.13.1"
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc", "zeroize"] }
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
scrypt = { version = "0.11.0", default-features = false }
tempfile = "3.27.0"
pubky = "=0.14.0"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-global-shortcut = "2.4.0"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSWorkspace", "NSRunningApplication", "NSWindow", "NSView", "NSColor", "objc2-quartz-core"] }
keyring-core = { version = "1.0.0", default-features = false }
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = ["keychain"] }
security-framework = { version = "3.7.0", default-features = false }

[target.'cfg(windows)'.dependencies]
keyring-core = { version = "1.0.0", default-features = false }
windows-native-keyring-store = { version = "1.1.0", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service = { version = "4.1.0", default-features = false, features = ["crypto-rust", "vendored"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.5.2"

[features]
# Default application backend; --no-default-features retains the legacy build
# for compatibility checks. Filesystem support guards remain in force.
default = ["file-vault"]
file-vault = []
# Disposable packaged migration testing only; never enable in release workflows.
migration-test = ["file-vault"]
# Release-mode preview with separate vault and credentials, but no seeded fixture.
isolated-preview = ["file-vault"]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
rand = "0.8"

# Stronghold's password derivation crosses several transitive crypto crates and
# is prohibitively slow when any of them are left unoptimized. Keep Tauthy's own
# code debuggable while compiling dependencies at release speed.
[profile.dev.package."*"]
opt-level = 3
