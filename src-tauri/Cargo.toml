[package]
name = "tauthy"
version = "0.3.0"
description = "A cross-platform TOTP authentication client built with tauri"
authors = ["philippwalter@pm.me"]
license = "GPL-3.0 License"
repository = "https://github.com/pwltr/tauthy"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
otp = { git = "https://github.com/TimDumol/rust-otp" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = [] }
iota-crypto = { version = "0.5.0", features = ["hmac", "sha", "pbkdf"] }
iota_stronghold = { version = "0.4.1", features = ["communication"] }
stronghold_engine = "0.4"
async-std = { version = "1.10", features = ["attributes"] }
once_cell = "1.8"
riker = "0.4"
slog = "2.7"
thiserror = "1.0"
zeroize = { version = "1.4", features = ["zeroize_derive"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2.11.0"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
rand = "0.8"
rusty-fork = "0.3"
