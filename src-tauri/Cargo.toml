[package]
name = "tauthy"
version = "0.4.2"
description = "A cross-platform TOTP authentication client built with tauri"
authors = ["philippwalter@pm.me"]
license = "GPL-3.0 License"
repository = "https://github.com/pwltr/tauthy"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
data-encoding = "2.11.1"
dryoc = { version = "1.0.0", default-features = false, features = ["u64_backend"] }
ring = "0.17.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = ["tray-icon"] }
iota-crypto = { version = "0.23.2", features = ["blake2b", "pbkdf2", "sha"] }
iota_stronghold = "2.1.0"
zeroize = { version = "1.4", features = ["zeroize_derive"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2.11.0"
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc", "zeroize"] }
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
scrypt = { version = "0.11.0", default-features = false }
tempfile = "3.27.0"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.4.4"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
rand = "0.8"

# Stronghold's password derivation crosses several transitive crypto crates and
# is prohibitively slow when any of them are left unoptimized. Keep Tauthy's own
# code debuggable while compiling dependencies at release speed.
[profile.dev.package."*"]
opt-level = 3
